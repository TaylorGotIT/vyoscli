<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">vyoscli — VyOS-style CLI on an OpenWrt base</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071626"/>
      <stop offset="1" stop-color="#0a2f4a"/>
    </linearGradient>
    <linearGradient id="owrt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a568c"/>
      <stop offset="1" stop-color="#083f68"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#78c8e6" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="squircle">
      <rect x="24" y="24" width="976" height="976" rx="210"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>

    <!-- OpenWrt foundation -->
    <circle cx="512" cy="760" r="256" fill="none" stroke="#00a6d6" stroke-opacity=".25" stroke-width="3"/>
    <circle cx="512" cy="760" r="238" fill="url(#owrt)"/>
    <circle cx="512" cy="760" r="228" fill="none" stroke="#0a568c" stroke-width="2"/>
    <path d="M 282 690 A 250 250 0 0 1 742 690" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="4"/>
    <text x="512" y="852" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="64" font-weight="700" fill="#f0f8ff">openwrt</text>
    <text x="512" y="902" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="700" letter-spacing="8" fill="#69e0ff">BASE</text>

    <!-- Terminal window -->
    <g filter="url(#shadow)">
      <rect x="180" y="330" width="664" height="340" rx="28" fill="#080f1a" stroke="#2a4a5e" stroke-width="3"/>
      <path d="M180 358a28 28 0 0 1 28-28h608a28 28 0 0 1 28 28v26H180z" fill="#0e1b2a"/>
      <path d="M180 384h664" stroke="#243e50" stroke-width="2"/>
    </g>
    <circle cx="210" cy="357" r="8" fill="#ff5f56"/>
    <circle cx="234" cy="357" r="8" fill="#ffbd2e"/>
    <circle cx="258" cy="357" r="8" fill="#27c93f"/>

    <!-- VyOS chevron -->
    <path d="M230 347h13l13 18h-13z" fill="#22d3ee"/>
    <path d="M256 365h13l13-18h-13z" fill="#22d3ee"/>

    <text x="300" y="365" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700" fill="#c4d6e4">vyoscli</text>

    <text x="220" y="426" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#7d93a8">root@openwrt:~$</text>
    <text x="390" y="426" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#e8f1f8">configure</text>
    <text x="220" y="474" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#3ddc97">root@openwrt#</text>
    <text x="390" y="474" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#e8f1f8">commit</text>
    <text x="220" y="522" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#3ddc97">OK  configuration applied</text>
    <text x="220" y="570" font-family="Consolas, 'Cascadia Mono', monospace" font-size="25" fill="#22d3ee">vyoscli&gt;</text>
    <rect x="342" y="550" width="14" height="28" fill="#22d3ee"/>

    <!-- Wordmark -->
    <text x="512" y="90" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="21" font-weight="700" letter-spacing="7" fill="#69e0ff">VYOS-STYLE CLI</text>
    <text x="512" y="228" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="112" font-weight="800" fill="#f5faff">vyos<tspan fill="#22d3ee">cli</tspan></text>
    <text x="512" y="278" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="33" fill="#9ab2c6">VyOS-style CLI for OpenWrt</text>
  </g>

  <rect x="24" y="24" width="976" height="976" rx="210" fill="none" stroke="#3c82a0" stroke-width="4"/>
  <rect x="40" y="40" width="944" height="944" rx="196" fill="none" stroke="#78dcf0" stroke-opacity=".12"/>
</svg>
