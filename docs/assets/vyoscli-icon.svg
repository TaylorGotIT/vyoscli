<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">vyoscli — VyOS-style CLI on an OpenWrt base</title>
  <defs>
    <linearGradient id="owrt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b4e2"/>
      <stop offset="1" stop-color="#008fbf"/>
    </linearGradient>
    <linearGradient id="vyos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f3a"/>
      <stop offset="1" stop-color="#0f2b4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#001e37" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#owrt)"/>

  <text x="512" y="216" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif"
        font-size="92" font-weight="700" fill="#ffffff">openwrt</text>

  <g filter="url(#shadow)">
    <circle cx="512" cy="620" r="300" fill="url(#vyos)"/>
  </g>
  <circle cx="512" cy="620" r="300" fill="none" stroke="#22d3ee" stroke-width="7"/>

  <text x="378" y="630" font-family="Consolas, 'Cascadia Mono', monospace"
        font-size="250" font-weight="700" fill="#ffffff">&gt;</text>
  <rect x="546" y="606" width="100" height="24" rx="5" fill="#22d3ee"/>

  <text x="512" y="835" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif"
        font-size="108" font-weight="700" fill="#ffb020">vyos<tspan fill="#ffd166">cli</tspan></text>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="none"
        stroke="#ffffff" stroke-opacity=".16" stroke-width="4"/>
</svg>
