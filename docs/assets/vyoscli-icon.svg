<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title">
  <title id="title">vyoscli — VyOS-style CLI on an OpenWrt base</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset="1" stop-color="#09273d"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a4f84"/>
      <stop offset="1" stop-color="#08426a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="520" r="318" fill="url(#base)"/>
  </g>
  <circle cx="512" cy="520" r="318" fill="none" stroke="#22d3ee" stroke-width="7"/>

  <text x="352" y="500" font-family="Consolas, 'Cascadia Mono', monospace" font-size="300" font-weight="700" fill="#f5faff">&gt;</text>
  <rect x="554" y="474" width="118" height="26" rx="5" fill="#22d3ee"/>

  <text x="512" y="716" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="92" font-weight="700" fill="#f5faff">vyos<tspan fill="#22d3ee">cli</tspan></text>

  <rect x="24" y="24" width="976" height="976" rx="220" fill="none" stroke="#2d6e8c" stroke-width="4"/>
</svg>
