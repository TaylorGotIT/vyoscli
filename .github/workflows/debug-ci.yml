name: debug-ci

on: push

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run CI steps and capture output
        run: |
          {
            echo "=== unit tests ==="
            python3 -m unittest discover -s tests -v || true
            echo "=== check-generated ==="
            ./scripts/check-generated.sh || true
            echo "=== package ==="
            python3 scripts/make-ipk.py --minimal-deps || true
            ls -l dist/*.ipk || true
          } > /tmp/ci.log 2>&1

      - name: Publish log as commit comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/ci.log', 'utf8').slice(-60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "```\n" + log + "\n```"
            });
