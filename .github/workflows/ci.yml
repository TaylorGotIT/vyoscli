name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Generated command reference is in sync
        run: ./scripts/check-generated.sh

      - name: Package (no SDK)
        run: |
          python3 scripts/make-ipk.py --minimal-deps
          ls -l dist/*.ipk
